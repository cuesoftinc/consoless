
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Console Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gaming: {
                900: '#0f0e17',
                800: '#1a1a2e',
                700: '#16213e',
                accent: '#e94560',
                neon: '#0ff0fc',
                retro: '#ff8e3c',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              retro: ['"Press Start 2P"', 'cursive'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'slide-in': 'slideIn 0.3s ease-out forwards',
              'fade-out': 'fadeOut 0.3s ease-in forwards',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            },
            keyframes: {
              slideIn: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              fadeOut: {
                '0%': { transform: 'translateX(0)', opacity: '1' },
                '100%': { transform: 'translateX(100%)', opacity: '0' },
              },
              fadeInUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom Scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0e17; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1a1a2e; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #e94560; 
      }
      
      /* Scanline effect for Retro Mode */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        pointer-events: none;
      }

      /* Audio Wave Animation */
      .sound-wave-bar {
        animation: soundWave 0s infinite ease-in-out;
      }
      @keyframes soundWave {
        0%, 100% { height: 4px; }
        50% { height: 16px; }
      }
      .sound-wave-bar:nth-child(1) { animation-duration: 0.4s; }
      .sound-wave-bar:nth-child(2) { animation-duration: 0.5s; }
      .sound-wave-bar:nth-child(3) { animation-duration: 0.3s; }
      .sound-wave-bar:nth-child(4) { animation-duration: 0.45s; }

      /* Utility classes */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.0"
  }
}
</script>
</head>
  <body class="bg-gaming-900 text-white h-screen overflow-hidden selection:bg-gaming-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
