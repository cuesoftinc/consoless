apiVersion: v3
kind: service
metadata:
  name: consoless-website
  displayName: consoless-website
  description: Consoless website
  owner: cuesoft
  tags:
    - app:consoless
    - component:website
  contacts:
    - type: email
      contact: cuelabs@cuesoft.io
  additionalOwners:
    - name: platform
      type: SRE
  links:
    - name: Repository
      type: repo
      provider: github
      url: https://github.com/cuesoftinc/consoless
